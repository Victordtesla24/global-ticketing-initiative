name: Deploy to VPS

# Continuous deployment to the Hostinger VPS (the production host).
# Runs on every push to main after CI. Requires three repository secrets:
#   VPS_HOST     e.g. srv1356245.hstgr.cloud
#   VPS_USER     e.g. root
#   VPS_SSH_KEY  private key whose public half is in the VPS user's ~/.ssh/authorized_keys
# No manual gates: green CI + push == deployed.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are configured
        id: cfg
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning::VPS_HOST / VPS_USER / VPS_SSH_KEY secrets not set — skipping VPS deploy"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SSH key
        if: steps.cfg.outputs.configured == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy main on the VPS
        if: steps.cfg.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${VPS_USER:-root}@$VPS_HOST" \
            'curl -fsSL https://raw.githubusercontent.com/Victordtesla24/global-ticketing-initiative/main/scripts/vps-deploy.sh | bash'

      - name: Verify production
        if: steps.cfg.outputs.configured == 'true'
        run: |
          sleep 10
          html=$(curl -fsSL --max-time 30 https://ticketalay.abacusai.cloud/)
          echo "$html" | grep -q "V2 Group" || { echo "::error::footer missing after deploy"; exit 1; }
          echo "$html" | grep -qi "Adversarial audit" && { echo "::error::audit chrome still served"; exit 1; }
          echo "production verified"
